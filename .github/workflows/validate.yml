name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend and mobile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run canonical frontend and mobile validation
        run: npm run verify

  php:
    name: Banking API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - name: Install API dependencies
        working-directory: services/banking-api
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Validate Composer manifests
        working-directory: services/banking-api
        run: composer validate --strict
      - name: Prepare Laravel runtime directories
        working-directory: services/banking-api
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/testing
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          chmod -R u+rwX,g+rwX bootstrap/cache storage
      - name: Test banking API
        working-directory: services/banking-api
        run: composer test
