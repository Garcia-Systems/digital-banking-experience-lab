name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Validate Expo configuration
        run: npm run mobile:validate
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - name: Install API dependencies
        working-directory: services/banking-api
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare Laravel runtime directories
        working-directory: services/banking-api
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/testing
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          chmod -R u+rwX,g+rwX bootstrap/cache storage
      - name: Test banking API
        working-directory: services/banking-api
        run: composer test
